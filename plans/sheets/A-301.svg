<text x="1080" y="160" font-size="13" text-anchor="start" font-weight="normal" fill="#1d1420">SECTION NOTES</text>
<text x="1080" y="181" font-size="13" text-anchor="start" font-weight="normal" fill="#1d1420">1. Hatched = cut by the section plane.</text>
<text x="1080" y="202" font-size="13" text-anchor="start" font-weight="normal" fill="#1d1420">2. Roof: 45° metal over the loft half. Rafters, ties and</text>
<text x="1080" y="223" font-size="13" text-anchor="start" font-weight="normal" fill="#1d1420">   uplift connections by engineer for your wind and snow.</text>
<text x="1080" y="244" font-size="13" text-anchor="start" font-weight="normal" fill="#1d1420">3. Loft: 16 x 10 ft under the roof. The other half of the</text>
<text x="1080" y="265" font-size="13" text-anchor="start" font-weight="normal" fill="#1d1420">   top is the metal rain deck with 3'-6" guards.</text>
<text x="1080" y="286" font-size="13" text-anchor="start" font-weight="normal" fill="#1d1420">4. Envelope (pick one, same outside size): stucco foam</text>
<text x="1080" y="307" font-size="13" text-anchor="start" font-weight="normal" fill="#1d1420">   walls, wood frame + drywall, or a 20 ft crate pair.</text>
<text x="1080" y="328" font-size="13" text-anchor="start" font-weight="normal" fill="#1d1420">5. Floor 2 and loft framing by engineer / span tables.</text>
<text x="1080" y="349" font-size="13" text-anchor="start" font-weight="normal" fill="#1d1420">6. Chimney: listed class-A pipe through every level,</text>
<text x="1080" y="370" font-size="13" text-anchor="start" font-weight="normal" fill="#1d1420">   clearances + height above the roof per the maker and</text>
<text x="1080" y="391" font-size="13" text-anchor="start" font-weight="normal" fill="#1d1420">   NFPA 211 / local code. Smoke + CO alarms every level.</text>
<text x="1080" y="412" font-size="13" text-anchor="start" font-weight="normal" fill="#1d1420">7. Carport: 9 ft clear (8 ft minimum). Keep vehicles</text>
