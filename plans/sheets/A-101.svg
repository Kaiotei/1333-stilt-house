<text x="70" y="778" font-size="12" text-anchor="start" font-weight="normal" fill="#1d1420">1. Windows 3'-0" x 4'-0" rough, sills 3'-0" above each floor (count + sizes in dims.js).</text>
<text x="70" y="796" font-size="12" text-anchor="start" font-weight="normal" fill="#1d1420">2. Inner stair and loft ladder positions are a model assumption, not fixed by the kit spec. Place them to suit, keeping code headroom.</text>
