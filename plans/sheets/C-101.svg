<text x="1500" y="92" font-size="20" text-anchor="middle" font-weight="bold" fill="#1d1420">N</text>
<text x="1300" y="760" font-size="12" text-anchor="start" font-weight="normal" fill="#1d1420">NOTES</text>
<text x="1300" y="777" font-size="12" text-anchor="start" font-weight="normal" fill="#1d1420">1. South (+x) faces the porch and roof solar. Rotate the whole</text>
<text x="1300" y="794" font-size="12" text-anchor="start" font-weight="normal" fill="#1d1420">   plan to suit your sun path; keep solar on the sunny side.</text>
<text x="1300" y="811" font-size="12" text-anchor="start" font-weight="normal" fill="#1d1420">2. Keep the tower close so the rain line stays short and falls</text>
<text x="1300" y="828" font-size="12" text-anchor="start" font-weight="normal" fill="#1d1420">   toward the upper tote.</text>
<text x="1300" y="845" font-size="12" text-anchor="start" font-weight="normal" fill="#1d1420">3. Turbine, shed and pen are concept extras, not in the kit spec.</text>
<text x="1300" y="862" font-size="12" text-anchor="start" font-weight="normal" fill="#1d1420">4. Check setbacks, easements, flood zone and septic / well</text>
<text x="1300" y="879" font-size="12" text-anchor="start" font-weight="normal" fill="#1d1420">   locations with your local authority.</text>
