<text x="1130" y="488" font-size="12" text-anchor="start" font-weight="normal" fill="#1d1420">NOTES</text>
<text x="1130" y="505" font-size="12" text-anchor="start" font-weight="normal" fill="#1d1420">1. Riser, tread, guard and handrail limits vary by code.</text>
<text x="1130" y="522" font-size="12" text-anchor="start" font-weight="normal" fill="#1d1420">   Check yours before cutting stringers.</text>
<text x="1130" y="539" font-size="12" text-anchor="start" font-weight="normal" fill="#1d1420">2. Stair can be unhooked from the porch for security (spec).</text>
<text x="1130" y="556" font-size="12" text-anchor="start" font-weight="normal" fill="#1d1420">   Design that connection with your engineer.</text>
<text x="1130" y="573" font-size="12" text-anchor="start" font-weight="normal" fill="#1d1420">3. Handrails must be graspable and continuous.</text>
