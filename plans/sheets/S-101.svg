<text x="1200" y="620" font-size="12" text-anchor="start" font-weight="normal" fill="#1d1420">NOTES</text>
<text x="1200" y="637" font-size="12" text-anchor="start" font-weight="normal" fill="#1d1420">1. Posts: 8x8 or larger (spec). Grade, species, treatment and</text>
<text x="1200" y="654" font-size="12" text-anchor="start" font-weight="normal" fill="#1d1420">   connections by engineer.</text>
<text x="1200" y="671" font-size="12" text-anchor="start" font-weight="normal" fill="#1d1420">2. Piers: concrete, below frost depth and flood line. Diameter,</text>
<text x="1200" y="688" font-size="12" text-anchor="start" font-weight="normal" fill="#1d1420">   depth and reinforcing by engineer for your soil.</text>
<text x="1200" y="705" font-size="12" text-anchor="start" font-weight="normal" fill="#1d1420">3. Post bases must resist uplift and lateral load (wind / flood).</text>
<text x="1200" y="722" font-size="12" text-anchor="start" font-weight="normal" fill="#1d1420">4. Keep the carport footprint clear: 16 x 20, 9 ft clear height.</text>
